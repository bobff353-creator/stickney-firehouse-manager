<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2b40">
  <title>Stickney Firehouse Manager - Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f2;color:#17364a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(100%,540px);padding:32px;border:1px solid #c9d1d5;border-top:6px solid #bd3328;border-radius:12px;background:#fff;box-shadow:0 18px 48px rgba(11,43,64,.15);text-align:center}
    .patch{width:112px;height:112px;border-radius:50%}
    h1{margin:20px 0 10px;font-size:clamp(26px,7vw,38px)}
    p{margin:0 auto 22px;max-width:420px;line-height:1.55}
    .warning{padding:14px;border-radius:8px;background:#fff5df;color:#6b4611;font-weight:650}
    button{min-height:46px;margin-top:22px;padding:0 20px;border:0;border-radius:8px;background:#0b2b40;color:#fff;font:750 15px/1 system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="patch" src="/icons/pwa-192.png" alt="Stickney Fire Department patch">
    <h1>You are offline</h1>
    <p>Reconnect to the internet to load current department operations, inspections, staffing, and apparatus records.</p>
    <div class="warning">For operational safety, this screen does not display possibly outdated department data.</div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
