<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory responsive audit — local only</title></head><body style="margin:0;background:#dae3e9;font:14px Arial"><header style="padding:10px;background:#fff4be;position:sticky;top:0;z-index:100">LOCAL TEST ONLY · fictional records. <label>Viewport <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1180</option></select></label> <label>Role <select id="role"><option value="admin">Admin</option><option value="member">Member</option></select></label><button id="measure">Check layout</button><span id="report"></span></header><iframe id="preview" title="Inventory audit viewport" src="inventory-audit-app.html?role=admin" style="display:block;width:390px;height:780px;border:0;margin:0 auto"></iframe><script>
const frame=document.getElementById('preview');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('role').onchange=e=>frame.src='inventory-audit-app.html?role='+e.target.value;document.getElementById('measure').onclick=()=>{const d=frame.contentDocument;const width=frame.contentWindow.innerWidth;const offenders=[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&(r.right>width+1||r.left < -1)&&getComputedStyle(e).position!=='fixed'});document.getElementById('report').textContent=` Width ${width}; body ${d.documentElement.scrollWidth}; overflow ${offenders.length}; errors: ${d.querySelector('#audit-errors')?.textContent||'none'}; ${d.querySelector('#audit-writes')?.textContent||''}`;};</script></body></html>
